<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertexa: protótipo navegável do redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F4;--sf:#FFFFFF;--sf2:#F2F2F0;--ln:#E5E5E2;--tx:#111314;--tx2:#4F5357;--tx3:#73777B;--or:#FE4927;--ori:#C7351A;--ors:#FFEDE8;--orl:#FFC9BB;--gr:#11764A;--grs:#E6F6EE;--ye:#9A6212;--yes:#FEF5DC;--rd:#C42B1F;--rds:#FDECEA;--bl:#2F5FCC;--bls:#EAF0FD;--bk:#101213;--onbk:#fff;--sh:0 24px 60px -30px rgba(16,18,19,.4)}
:root[data-theme=dark]{--bg:#101213;--sf:#1A1C1E;--sf2:#212427;--ln:#2A2D30;--tx:#F4F4F3;--tx2:#B9BCBF;--tx3:#8B8F93;--ori:#FF7A5C;--ors:#2B1712;--orl:#5C2416;--gr:#3CC98F;--grs:#12281F;--ye:#F2B82A;--yes:#2A2312;--rd:#FF6369;--rds:#2D1517;--bl:#7FA4F2;--bls:#16203A;--bk:#F4F4F3;--onbk:#101213;--sh:0 24px 60px -30px #000}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Google Sans Flex","Google Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.num,td,.kpi b{font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:212px minmax(0,1fr) auto;height:100vh}
/* sidebar */
.sb{background:var(--sf);border-right:1px solid var(--ln);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.clin{display:flex;gap:9px;align-items:center;padding:4px 6px 14px}
.clin i{width:32px;height:32px;border-radius:9px;background:var(--bk);color:var(--onbk);display:grid;place-items:center;font-style:normal;font-weight:600}
.clin b{display:block}.clin span{font-size:11.5px;color:var(--tx3)}
.nv{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 11px;border-radius:10px;border:0;border-left:2px solid transparent;background:none;color:var(--tx2);cursor:pointer}
.nv:hover{background:var(--sf2);color:var(--tx)}
.nv.on{background:var(--ors);color:var(--ori);font-weight:600;border-left-color:var(--or)}
.nv em{font-style:normal;font-size:11px;background:var(--or);color:#fff;border-radius:20px;padding:0 6px;font-weight:600}
.nv.ia{background:var(--ors);border:1px solid var(--orl);color:var(--ori);font-weight:600;margin-bottom:8px;justify-content:flex-start}
.nv.ia kbd{margin-left:auto;font:inherit;font-size:10.5px;font-weight:500;background:var(--sf);border:1px solid var(--orl);border-radius:5px;padding:0 4px}
.tg{width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:50% 38%;background:#fff;flex:none}
.sb .sp{flex:1}
.proto{font-size:11.5px;color:var(--tx3);padding:8px 10px;border-top:1px solid var(--ln);margin-top:8px}
/* main */
.mn{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:10px 22px;border-bottom:1px solid var(--ln);background:var(--sf)}
.srch{flex:1;max-width:380px;border:1px solid var(--ln);border-radius:10px;padding:7px 11px;background:var(--bg)}
.top .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.ct{flex:1;overflow:auto;padding:22px}
.wr{max-width:1060px}
.h1{font-size:25px;font-weight:500;letter-spacing:-.015em}
.sub{color:var(--tx3);font-size:13px;margin-top:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sb2{justify-content:space-between}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr)}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;min-width:0}
.cd h3{font-size:14.5px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cd h3 small{font-weight:400;color:var(--tx3);font-size:12px}
.kpi span{font-size:12px;color:var(--tx3);display:block}
.kpi b{display:block;font-size:26px;font-weight:500;letter-spacing:-.02em}
.kpi.at{border-color:var(--or);background:var(--ors)}.kpi.at b{color:var(--ori)}
button.kpi{text-align:left;cursor:pointer}
.ln{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.ln:first-of-type{border-top:0}
.gx{flex:1;min-width:0}
.gx b{display:block;font-weight:600}
.gx span{font-size:12px;color:var(--tx3)}
.av{width:30px;height:30px;border-radius:50%;background:var(--sf2);border:1px solid var(--ln);display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:var(--tx2);flex:none}
.av.o{background:var(--ors);border-color:var(--orl);color:var(--ori)}
.av.s{width:22px;height:22px;font-size:9px}
.av.l{width:46px;height:46px;font-size:15px}
.pl{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--sf2);color:var(--tx2);white-space:nowrap}
.pl.o{background:var(--ors);color:var(--ori)}.pl.g{background:var(--grs);color:var(--gr)}.pl.r{background:var(--rds);color:var(--rd)}.pl.y{background:var(--yes);color:var(--ye)}.pl.b{background:var(--bls);color:var(--bl)}
.b{font-size:13px;font-weight:500;padding:7px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;white-space:nowrap}
.b:hover{border-color:var(--tx3)}
.b.p{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.b.p:hover{background:#E0391B}
.b.d{background:var(--bk);border-color:var(--bk);color:var(--onbk)}
.b.ia{background:var(--ors);border-color:var(--orl);color:var(--ori);display:inline-flex;align-items:center;gap:6px}
.b.ia .tg{width:16px;height:16px}
.b.sm{font-size:12px;padding:4px 9px;border-radius:8px}
.b:disabled{opacity:.4;cursor:default}
.b.ok{background:var(--grs);border-color:transparent;color:var(--gr);cursor:default}
.chs{display:flex;gap:6px;flex-wrap:wrap}
.ch{font-size:12.5px;padding:4px 11px;border-radius:20px;border:1px solid var(--ln);background:var(--sf);color:var(--tx2);cursor:pointer}
.ch.on{background:var(--bk);color:var(--onbk);border-color:var(--bk)}
.tabs{display:flex;gap:4px;margin:14px 0;border-bottom:1px solid var(--ln);overflow:auto}
.tabs button{padding:8px 13px;border:0;background:none;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--tx);font-weight:600;border-bottom-color:var(--or)}
.seg{display:inline-flex;gap:2px;background:var(--sf2);border-radius:10px;padding:3px}
.seg button{padding:5px 12px;border-radius:8px;border:0;background:none;font-size:13px;color:var(--tx2);cursor:pointer}
.seg button.on{background:var(--sf);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--tx3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}
td{padding:9px 10px;border-bottom:1px solid var(--ln)}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--sf2)}
.in{width:100%;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;background:var(--sf)}
td .in{padding:5px 7px;border-radius:8px}
label.f{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:10px}
label.f .in{margin-top:4px;color:var(--tx)}
.fld{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--ln)}
.fld:first-of-type{border-top:0}
.fld>span:first-child{color:var(--tx3)}
.unc{background:var(--ors);box-shadow:inset 0 0 0 1px var(--orl);border-radius:6px;padding:1px 6px;color:var(--ori);font-weight:600}
.src{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--bls);color:var(--bl);margin-left:4px;white-space:nowrap}
.bar{height:7px;border-radius:7px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;background:var(--or);border-radius:7px;transition:width .4s}
.ph{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ph .vr{margin-left:auto;text-align:right;line-height:1.15}
.ph .vr b{font-size:26px;font-weight:500}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kan>div{background:var(--sf2);border-radius:14px;padding:10px;min-height:200px}
.kan h3{font-size:13.5px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.kan .cd{padding:10px 12px;margin-bottom:8px;border-radius:12px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.week>div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px;min-height:230px}
.week>div.td{border-color:var(--or)}
.week h4{margin:0 0 8px;font-size:12.5px;font-weight:600}
.ev{border-left:3px solid var(--bl);background:var(--bls);border-radius:7px;padding:5px 7px;margin-bottom:6px;font-size:12px}
.ev.r{border-color:var(--gr);background:var(--grs)}.ev.e{border-color:var(--tx3);background:var(--sf2)}.ev.g{border-color:var(--or);background:var(--ors)}
.bub{max-width:90%;padding:9px 12px;border-radius:15px;font-size:13.5px;line-height:1.45}
.bub.u{align-self:flex-end;background:var(--bk);color:var(--onbk);border-bottom-right-radius:5px}
.bub.a{align-self:flex-start;background:var(--bg);border:1px solid var(--ln);border-bottom-left-radius:5px}
.bub ul{margin:6px 0 0;padding-left:17px}.bub li{margin:2px 0}
.dr{margin-top:8px;border:1px dashed var(--orl);background:var(--ors);border-radius:11px;padding:8px 10px;font-size:13px}
.dr>b{display:block;font-size:11.5px;color:var(--ori);margin-bottom:3px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* painel IA */
.pn{width:340px;background:var(--sf);border-left:1px solid var(--ln);display:flex;flex-direction:column;height:100vh}
.pn-top{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--ln)}
.pn-top .tg{width:32px;height:32px;border:1px solid var(--ln)}
.pn-top small{display:block;font-size:11.5px;color:var(--tx3)}
.pn-top button{margin-left:auto}
.pn-ctx{margin:10px 14px 0;font-size:12px;color:var(--tx2);background:var(--sf2);border-radius:8px;padding:6px 9px}
.pn-body{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.pn-sug{padding:0 14px 8px}
.pn form{margin:0 14px 8px;display:flex;gap:6px}
.pn-rule{font-size:11px;color:var(--tx3);padding:0 14px 12px;text-align:center}
/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(16,18,19,.5);display:grid;place-items:center;padding:20px;z-index:20}
.md{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:20px;box-shadow:var(--sh)}
.md.w{width:min(760px,100%)}
.md h2{font-size:18px;font-weight:600;margin-bottom:4px}
.md .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--bk);color:var(--onbk);border-radius:12px;padding:10px 16px;font-weight:500;z-index:30;display:flex;gap:9px;align-items:center;box-shadow:var(--sh)}
.toast i{width:8px;height:8px;border-radius:50%;background:#3CC98F}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.pdf{background:#fff;color:#111;border:1px solid #ddd;border-radius:6px;padding:16px;font-size:12px;box-shadow:0 8px 20px -12px rgba(0,0,0,.3)}
.phone{width:250px;margin:0 auto;border-radius:30px;border:8px solid #101213;background:var(--bg);padding:14px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:9px}
.drop{border:2px dashed var(--orl);background:var(--ors);border-radius:14px;padding:26px;text-align:center;color:var(--ori)}
.rec{display:inline-flex;align-items:center;gap:6px}.rec i{width:9px;height:9px;border-radius:50%;background:var(--rd);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.empty{text-align:center;color:var(--tx3);padding:34px 10px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.lib .cd{padding:0;overflow:hidden}.lib .gif{height:84px;background:#101213;color:#fff;display:grid;place-items:center;font-size:11px;letter-spacing:.04em}.lib .cd div+div{padding:8px 10px}
.sw{width:38px;height:22px;border-radius:20px;border:0;background:var(--ln);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--or)}.sw.on::after{left:19px}
@media (max-width:1180px){.pn{position:fixed;right:0;top:0;z-index:15;box-shadow:var(--sh)}}
@media (max-width:860px){#app{grid-template-columns:1fr;height:auto}.sb{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--ln)}.sb .clin,.sb .sp,.proto{display:none}.nv{white-space:nowrap;width:auto}.mn{height:auto}.g4,.g3,.g2,.g21,.g12,.kan,.week{grid-template-columns:1fr}.pn{width:100%}}
@media (prefers-reduced-motion:reduce){.rec i{animation:none}.bar i{transition:none}}
</style>
</head>

<div id="app"></div><div id="layer"></div>

  else body=`<div class="cd"><h3>Prontuário ${B('🎙 Iniciar atendimento','atend',p.id,'p sm')}</h3>${p.pront.map(x=>`<div class="ln"><b class="num">${x[0]}</b><div class="gx">${x[1]}</div><span class="pl ${x[2]==='Finalizado'?'g':'y'}">${x[2]}</span></div>`).join('')||'<div class="empty">Nenhum atendimento ainda. Clique em Iniciar atendimento.</div>'}</div>`;}
 if(S.tab==='planos'){const seg=`<div class="seg">${[['dieta','Plano alimentar'],['treino','Treino']].map(s=>`<button class="${S.sub===s[0]?'on':''}" data-act="sub" data-a="${s[0]}">${s[1]}</button>`).join('')}</div>`;

  else{const t=p.treino;if(t.st==='nenhum')body=`<div class="row sb2" style="margin-bottom:12px">${seg}</div><div class="cd empty">Este paciente ainda não tem treino.<div class="row" style="justify-content:center;margin-top:12px">${B('Criar do zero','novoTreino')}${BIA('Gerar com IA','sug','Monta um treino ABCD para '+p.n.split(' ')[0])}</div></div>`;
   else{const b=t.b[t.sel];body=`<div class="row sb2" style="margin-bottom:12px">${seg}<div class="row">${BIA('Gerar com IA','sug','Monta um treino ABCD para '+p.n.split(' ')[0])}${t.st==='ativo'?B('Enviar ou exportar','expTreino','','d'):B('Publicar treino','pubTreino','','p')}</div></div><div class="cd"><h3>Treino ABCD · v${t.v} <small><span class="pl ${t.st==='ativo'?'g':'y'}">${t.st==='ativo'?'Ativo no app':'Rascunho · nada foi publicado'}</span></small></h3><div class="chs" style="margin-bottom:10px">${Object.keys(t.b).map(k=>`<button class="ch ${k===t.sel?'on':''}" data-act="bloco" data-a="${k}">${k} · ${t.b[k].n}</button>`).join('')}</div><table><tr><th>Exercício</th><th>Séries</th><th>Reps</th><th>Carga</th><th>Intervalo</th><th>Instrução (texto livre)</th><th></th></tr>${b.ex.map((e,i)=>`<tr><td><b>${e.n}</b></td>${['s','r','c','i','o'].map(f=>`<td><input class="in" style="width:${f==='o'?'100%':'74px'}" data-ex="${i}:${f}" value="${esc(e[f])}" ${f==='o'?'placeholder="Escreva a orientação"':''}></td>`).join('')}<td>${B('✕','delEx',i,'sm')}</td></tr>`).join('')}</table><div class="row" style="margin-top:10px"><select class="in" id="addex" style="max-width:280px">${LIB.map(x=>`<option>${x[0]}</option>`).join('')}</select>${B('+ Adicionar da Biblioteca','addEx','','sm')}<span class="sub">${b.ex.length} exercícios · ${b.min} min</span></div></div>`;}}}
 if(S.tab==='evol'){const m=[...p.med];if(!m.length||m[m.length-1][1]!==p.peso)m.push(['atual',p.peso,p.gord]);const mx=Math.max(...m.map(x=>x[1])),mn=Math.min(...m.map(x=>x[1]));const pts=m.map((x,i)=>`${20+i*(380/Math.max(1,m.length-1))},${18+(mx-x[1])/Math.max(.1,mx-mn)*74}`);
  body=`<div class="row" style="justify-content:flex-end;margin-bottom:12px">${BIA('Ler laudo de exemplo','impLaudo',p.id)}</div>${impBox('laudo')}<div class="grid g3">${kpi('Peso',f1(p.peso)+' kg','mesma fonte de todas as telas')}${kpi('% gordura',p.gord?f1(p.gord)+'%':'–','última avaliação')}${kpi('IMC',f1(imc),'calculado pelo sistema')}</div><div class="cd" style="margin-top:12px"><h3>Evolução do peso <small>${m.length} medidas</small></h3>${m.length>1?`<svg viewBox="0 0 420 120" style="width:100%;max-width:640px"><path d="M0 18H420M0 55H420M0 92H420" stroke="var(--ln)"/><polyline points="${pts.join(' ')}" fill="none" stroke="#FE4927" stroke-width="2.5"/>${pts.map(q=>`<circle cx="${q.split(',')[0]}" cy="${q.split(',')[1]}" r="3.5" fill="#FE4927"/>`).join('')}${m.map((x,i)=>`<text x="${20+i*(380/Math.max(1,m.length-1))}" y="114" font-size="10" fill="#73777B" text-anchor="middle">${x[0]} · ${f1(x[1])}</text>`).join('')}</svg>`:'<div class="empty">Uma medida só. Leia um laudo para ver a evolução.</div>'}</div>`;}
 if(S.tab==='docs')body=`<div class="cd" style="padding:6px 10px">${p.docs.length?`<table><tr><th>Documento</th><th>Tipo</th><th>Data</th><th>Enviado por</th><th>No app do paciente</th><th></th></tr>${p.docs.map((d,i)=>`<tr><td><b>${d[0]}</b></td><td><span class="pl">${d[1]}</span></td><td>${d[2]}</td><td>${d[3]}</td><td class="sub">${d[4]}</td><td style="text-align:right">${d[4]==='—'?B('Enviar ao paciente','envDoc',i,'sm'):''}</td></tr>`).join('')}</table>`:'<div class="empty">Nenhum documento. Tudo que for importado ou enviado aparece aqui.</div>'}</div>`;
 return head+body;}
};
